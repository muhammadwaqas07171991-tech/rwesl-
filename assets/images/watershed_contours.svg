<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none">
  <defs>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="contourGrad1" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="contourGrad2" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Major River Channel Gradient Backbone -->
  <path d="M -50,180 C 250,220 380,420 580,480 C 780,540 920,410 1150,560 C 1380,710 1480,820 1700,880" 
        stroke="url(#streamGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 6"/>
  <path d="M 580,480 C 650,600 710,750 820,860 C 930,970 1020,1020 1100,1080" 
        stroke="url(#streamGrad)" stroke-width="1.8" stroke-dasharray="4 6"/>
  <path d="M 280,-40 C 350,120 420,260 580,480" 
        stroke="url(#streamGrad)" stroke-width="1.5" stroke-dasharray="3 5"/>

  <!-- Topographic Watershed Contour Isolines -->
  <!-- Level 1 -->
  <path d="M -80,240 C 220,290 350,500 560,560 C 760,620 900,480 1130,630 C 1360,780 1460,880 1680,940" 
        stroke="url(#contourGrad1)" stroke-width="1.2"/>
  <path d="M -60,120 C 260,150 400,340 600,400 C 800,460 940,340 1170,490 C 1400,640 1500,750 1720,810" 
        stroke="url(#contourGrad1)" stroke-width="1.2"/>

  <!-- Level 2 -->
  <path d="M -100,300 C 200,360 320,580 540,640 C 740,700 880,550 1110,700 C 1340,850 1440,940 1660,1000" 
        stroke="url(#contourGrad2)" stroke-width="1"/>
  <path d="M -40,60 C 280,80 420,260 620,320 C 820,380 960,270 1190,420 C 1420,570 1520,680 1740,740" 
        stroke="url(#contourGrad2)" stroke-width="1"/>

  <!-- Level 3 Upper Catchment Ridge -->
  <path d="M -120,380 C 180,440 290,660 520,720 C 720,780 860,620 1090,770 C 1320,920 1420,1000 1640,1060" 
        stroke="url(#contourGrad1)" stroke-width="0.8"/>
  <path d="M -20,0 C 300,10 440,180 640,240 C 840,300 980,200 1210,350 C 1440,500 1540,610 1760,670" 
        stroke="url(#contourGrad1)" stroke-width="0.8"/>

  <!-- Level 4 Crest Contours -->
  <path d="M -140,460 C 160,520 260,740 500,800 C 700,860 840,690 1070,840 C 1300,990 1400,1060 1620,1120" 
        stroke="url(#contourGrad2)" stroke-width="0.7"/>
  <path d="M 0,-60 C 320,-60 460,100 660,160 C 860,220 1000,130 1230,280 C 1460,430 1560,540 1780,600" 
        stroke="url(#contourGrad2)" stroke-width="0.7"/>

  <!-- Sub-Basin Micro Loops (Valleys & Peaks) -->
  <path d="M 320,400 C 360,370 420,390 430,440 C 440,490 380,530 330,510 C 280,490 280,430 320,400 Z" 
        stroke="url(#contourGrad1)" stroke-width="0.9" stroke-dasharray="2 3"/>
  <path d="M 850,300 C 900,260 970,280 980,340 C 990,400 920,440 860,420 C 800,400 800,340 850,300 Z" 
        stroke="url(#contourGrad2)" stroke-width="0.9" stroke-dasharray="2 3"/>
  <path d="M 1250,680 C 1300,640 1370,660 1390,720 C 1410,780 1340,820 1280,810 C 1220,800 1200,720 1250,680 Z" 
        stroke="url(#contourGrad1)" stroke-width="0.9"/>

  <!-- Telemetry Sensor Network Nodes (Monitoring Points) -->
  <circle cx="580" cy="480" r="5" fill="#00d4ff"/>
  <circle cx="580" cy="480" r="14" fill="url(#nodeGlow)"/>
  
  <circle cx="380" cy="420" r="4" fill="#38bdf8"/>
  <circle cx="380" cy="420" r="10" fill="url(#nodeGlow)"/>

  <circle cx="920" cy="410" r="4.5" fill="#10b981"/>
  <circle cx="920" cy="410" r="12" fill="url(#nodeGlow)"/>

  <circle cx="1150" cy="560" r="5" fill="#00d4ff"/>
  <circle cx="1150" cy="560" r="15" fill="url(#nodeGlow)"/>

  <circle cx="710" cy="750" r="4" fill="#38bdf8"/>
  <circle cx="710" cy="750" r="10" fill="url(#nodeGlow)"/>

  <circle cx="820" cy="860" r="4" fill="#10b981"/>
  <circle cx="820" cy="860" r="10" fill="url(#nodeGlow)"/>
</svg>
